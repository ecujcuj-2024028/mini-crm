services:
  postgres:
    image: postgres:16-alpine
    container_name: minicrm_postgres
    restart: always
    environment:
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password
      POSTGRES_DB: minicrm_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d minicrm_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: minicrm_backend
    restart: always
    ports:
      - "4000:4000"
    volumes:
      - ./backend/src:/app/src
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: "postgresql://crm_user:crm_password@postgres:5432/minicrm_db?schema=public"
      JWT_SECRET: "mini_crm_secret_jwt_key_2026_super_secure"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
